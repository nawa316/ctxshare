[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxshare"
version = "0.1.1"
description = "Portable context windows between ChatGPT, Claude and Gemini"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nawa316" }]
dependencies = []

[project.scripts]
ctxshare = "ctxshare.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
